<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Panel Central – Estado de Bomberos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.0/dist/umd/index.min.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</head>
<body class="container py-4">
  <h2 class="mb-4">Panel Central</h2>
  <div id="companies" class="row g-3"></div>

  <script>
    // Cuando la página carga, nos aseguramos que el usuario está autenticado y es central
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (!session) {
        location.href = 'index.html';
        return;
      }
      // Verificar rol central
      supabase.from('profiles').select('role').eq('id', session.user.id).single().then(({ data, error }) => {
        if (error || data.role !== 'central') {
          alert('Acceso denegado: necesita rol central');
          location.href = 'index.html';
        } else {
          initCentral();
        }
      });
    });

    function initCentral() {
      const container = document.getElementById('companies');
      // Escucha en tiempo real todos los bomberos
      supabase.channel('public:firefighters')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'firefighters' }, payload => {
          // Cada cambio vuelve a cargar todos los datos (simplicidad)
          loadData();
        })
        .subscribe();
      loadData();

      function loadData() {
        supabase.from('firefighters').select('*').order('company', { ascending: true }).then(({ data, error }) => {
          if (error) { console.error(error); return; }
          const map = {};
          data.forEach(row => {
            if (!map[row.company]) map[row.company] = [];
            map[row.company].push(row);
          });
          container.innerHTML = '';
          Object.entries(map).forEach(([company, rows]) => {
            const col = document.createElement('div');
            col.className = 'col-md-6';
            col.innerHTML = `<h4>${company}</h4>` +
              rows.map(r => `<p><strong>${r.nombre} ${r.apellido}</strong> – ${r.cargo}<br/>Estado: <span class="${r.en_servicio ? 'text-success' : 'text-danger'}">${r.en_servicio ? 'En Servicio' : 'Fuera de Servicio'}</span></p>`).join('');
            container.appendChild(col);
          });
        });
      }
    }
  </script>
</body>
</html>

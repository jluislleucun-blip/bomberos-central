<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Login – Central de Bomberos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.0/dist/umd/index.min.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</head>
<body class="container py-5">
  <h2 class="mb-4">Acceso Bomberos</h2>
  <form id="loginForm" class="row g-3">
    <div class="col-md-6">
      <label class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" id="email" required />
    </div>
    <div class="col-md-6">
      <label class="form-label">Contraseña</label>
      <input type="password" class="form-control" id="password" required />
    </div>
    <div class="col-12">
      <button type="submit" class="btn btn-primary">Entrar</button>
    </div>
  </form>

  <script>
    const form = document.getElementById('loginForm');
    form.addEventListener('submit', async e => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) {
        alert('Error: ' + error.message);
        return;
      }
      // fetch profile to know role
      const { data: profile, error: profErr } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
      if (profErr) {
        alert('Perfil no encontrado: ' + profErr.message);
        return;
      }
      if (profile.role === 'central') {
        location.href = 'central.html';
      } else {
        // any other role is a company name
        location.href = 'company.html';
      }
    });
  </script>
</body>
</html>

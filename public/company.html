<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Compañía – Registro de Bomberos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.44.0/dist/umd/index.min.js"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>
</head>
<body class="container py-4">
  <h2 class="mb-4">Registro / Estado de Bombero</h2>
  <form id="regForm" class="row g-3">
    <div class="col-12"><input class="form-control" id="nombre" placeholder="Nombre" required /></div>
    <div class="col-12"><input class="form-control" id="apellido" placeholder="Apellido" required /></div>
    <div class="col-12"><input class="form-control" id="rut" placeholder="RUT" required /></div>
    <div class="col-12"><input class="form-control" id="clave" placeholder="Clave Bombero" required /></div>
    <div class="col-12"><input class="form-control" id="cargo" placeholder="Cargo Actual" required /></div>
    <div class="col-12">
      <label class="form-label">Estado</label>
      <select class="form-select" id="estado" required>
        <option value="true">En Servicio</option>
        <option value="false">Fuera de Servicio</option>
      </select>
    </div>
    <div class="col-12"><button type="submit" class="btn btn-success">Guardar</button></div>
  </form>

  <script>
    // Verificar autenticación y rol de compañía
    supabase.auth.getSession().then(({ data: { session } }) => {
      if (!session) { location.href = 'index.html'; return; }
      supabase.from('profiles').select('role').eq('id', session.user.id).single().then(({ data, error }) => {
        if (error || data.role === 'central') {
          alert('Solo usuarios de compañías pueden acceder a esta página');
          location.href = 'index.html';
          return;
        }
        // role is the company name (Primera, Segunda, ...)
        const companyName = data.role;
        initCompany(companyName);
      });
    });

    function initCompany(company) {
      const form = document.getElementById('regForm');
      form.addEventListener('submit', async e => {
        e.preventDefault();
        const payload = {
          nombre: document.getElementById('nombre').value.trim(),
          apellido: document.getElementById('apellido').value.trim(),
          rut: document.getElementById('rut').value.trim(),
          clave_bombero: document.getElementById('clave').value.trim(),
          cargo: document.getElementById('cargo').value.trim(),
          company: company,
          en_servicio: document.getElementById('estado').value === 'true'
        };
        const { data, error } = await supabase.from('firefighters').insert([payload]);
        if (error) {
          alert('Error al guardar: ' + error.message);
        } else {
          alert('Bombero registrado correctamente');
          form.reset();
        }
      });
    }
  </script>
</body>
</html>
